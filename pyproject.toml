[project]
name = "fionatrade"
version = "0.2.0"
description = "FionaTrade V2: multi-agent autonomous trading research stack"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.30",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.3.0",
  "jinja2>=3.1.4",
  "httpx>=0.27.0",
  "requests>=2.31.0",
  "feedparser>=6.0.11",
  "python-dateutil>=2.9.0.post0",
  "apscheduler>=3.10.4",
  "orjson>=3.10.6",
  "yfinance>=0.2.40",
  "langgraph>=0.2.0",
  "langchain-openai>=0.2.0",
  "langchain-core>=0.3.0",
  "ta>=0.11.0",
  "pandas>=2.2.0",
  "alpaca-py>=0.26.0",
  "psycopg[binary]>=3.2.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-cov>=5.0.0"
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
