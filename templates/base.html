<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ title }} - FionaTrade</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;700&family=Newsreader:opsz,wght@6..72,500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f6f1e8;
      --panel: #fffefb;
      --ink: #212322;
      --muted: #6f6d66;
      --line: #d8d0c2;
      --accent: #0f6c78;
      --accent-2: #b84f2b;
      --ok: #2e7d32;
      --warn: #bd7f12;
      --bad: #aa2a2a;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "IBM Plex Sans", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% -20%, #d7ead4 0, transparent 45%),
        radial-gradient(circle at 85% 0%, #f0d8c1 0, transparent 40%),
        var(--bg);
    }

    .layout {
      max-width: 1280px;
      margin: 0 auto;
      padding: 18px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .brand {
      font-family: "Newsreader", serif;
      font-size: 28px;
      letter-spacing: 0.4px;
    }

    .sub {
      color: var(--muted);
      font-size: 13px;
      margin-top: 4px;
    }

    nav {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    nav a {
      text-decoration: none;
      color: var(--ink);
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.65);
      transition: transform .2s ease, border-color .2s ease;
      font-size: 13px;
    }

    nav a:hover {
      transform: translateY(-1px);
      border-color: var(--accent);
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px;
      box-shadow: 0 3px 14px rgba(0, 0, 0, 0.04);
      animation: fadeUp .35s ease;
    }

    @keyframes fadeUp {
      from { opacity: .3; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      gap: 12px;
    }

    .card {
      grid-column: span 3;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
    }

    .label { color: var(--muted); font-size: 12px; }
    .value { font-size: 24px; font-weight: 700; margin-top: 4px; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th, td {
      border-bottom: 1px solid var(--line);
      text-align: left;
      padding: 8px;
      vertical-align: top;
    }

    th {
      color: var(--muted);
      font-weight: 500;
      position: sticky;
      top: 0;
      background: var(--panel);
    }

    .tag {
      display: inline-block;
      border-radius: 999px;
      padding: 3px 8px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .3px;
    }

    .tag.valid { background: #e8f4ea; color: var(--ok); }
    .tag.watch { background: #fdf3e0; color: var(--warn); }
    .tag.rejected { background: #f8e5e5; color: var(--bad); }

    .muted { color: var(--muted); }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }

    @media (max-width: 980px) {
      .card { grid-column: span 6; }
    }

    @media (max-width: 640px) {
      .layout { padding: 10px; }
      .card { grid-column: span 12; }
      table { display: block; overflow-x: auto; }
      .brand { font-size: 24px; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <div class="top">
      <div>
        <div class="brand">FionaTrade V1</div>
        <div class="sub">Event-driven paper execution lab</div>
      </div>
      <nav>
        <a href="/">Dashboard</a>
        <a href="/news">News</a>
        <a href="/events">Event Stream</a>
        <a href="/signals">Signals</a>
        <a href="/paper">Paper Trading</a>
        <a href="/backtests">Backtests</a>
        <a href="/agents">Agents</a>
        <a href="/settings">Settings</a>
      </nav>
    </div>

    <div class="panel">
      <div style="margin-bottom:12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff7ec;color:#6b4a1d;font-size:13px;">
        中文提示：未配置 LLM 时，系统会自动切换到规则回退模式；新闻接入默认包含 SEC + RSS，Finnhub 需配置 API Key。
      </div>
      {% block content %}{% endblock %}
    </div>
  </div>
</body>
</html>
