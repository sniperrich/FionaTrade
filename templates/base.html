<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block page_title %}{{ title }}{% endblock %} — FionaTrade</title>
  <link rel="stylesheet" href="/static/ft.css" />
  {% block head %}{% endblock %}
</head>
<body>
<div class="app">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="brand-name">FionaTrade</div>
      <div class="brand-version">v0.2 · Agent Mode</div>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-section-label">Overview</div>
      <a class="nav-link {% if request.url.path == '/' %}active{% endif %}" href="/">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        Dashboard
      </a>
      <a class="nav-link {% if request.url.path.startswith('/live') %}active{% endif %}" href="/live">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>
        Live Trading
      </a>
      <a class="nav-link {% if request.url.path.startswith('/agents') %}active{% endif %}" href="/agents">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M16.24 7.76a6 6 0 0 1 0 8.49m-8.48-.01a6 6 0 0 1 0-8.49M4.93 4.93a10 10 0 0 0 0 14.14"/></svg>
        AI Agents
      </a>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-section-label">Data</div>
      <a class="nav-link {% if request.url.path.startswith('/news') %}active{% endif %}" href="/news">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"/><path d="M18 14h-8M15 18h-5M10 6h8v4h-8z"/></svg>
        News Feed
      </a>
      <a class="nav-link {% if request.url.path.startswith('/events') %}active{% endif %}" href="/events">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        Event Stream
      </a>
      <a class="nav-link {% if request.url.path.startswith('/signals') %}active{% endif %}" href="/signals">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        Signals
      </a>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-section-label">Research</div>
      <a class="nav-link {% if request.url.path.startswith('/paper') %}active{% endif %}" href="/paper">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        Paper Engine
      </a>
      <a class="nav-link {% if request.url.path.startswith('/backtests') %}active{% endif %}" href="/backtests">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M18.4 7.5l-7.8 7.8-3.5-3.5-4 4"/></svg>
        Backtests
      </a>
      <a class="nav-link {% if request.url.path.startswith('/settings') %}active{% endif %}" href="/settings">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        Settings
      </a>
    </div>

    <!-- Live status indicator -->
    <div class="sidebar-status" id="sidebar-status">
      <div class="status-row">
        <div class="dot grey" id="market-dot"></div>
        <span id="market-label">Checking market…</span>
      </div>
      <div class="status-row">
        <div class="dot grey" id="llm-dot"></div>
        <span id="llm-label">LLM status…</span>
      </div>
    </div>
  </aside>

  <!-- Main area -->
  <main class="main">
    {% block content %}{% endblock %}
  </main>
</div>

<!-- Toast container -->
<div id="toast-container"></div>

<script>
// ── Global utilities ──────────────────────────────────────────────────────
function toast(msg, type='') {
  const el = document.createElement('div');
  el.className = 'toast' + (type ? ' '+type : '');
  el.textContent = msg;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(() => el.remove(), 4000);
}

function readViewCache(key, maxAgeMs=60000) {
  try {
    const raw = sessionStorage.getItem(key);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (!parsed || typeof parsed !== 'object') return null;
    if (!parsed.ts || (Date.now() - parsed.ts > maxAgeMs)) return null;
    return parsed.data;
  } catch (_) {
    return null;
  }
}

function writeViewCache(key, data) {
  try {
    sessionStorage.setItem(key, JSON.stringify({ ts: Date.now(), data }));
  } catch (_) {}
}

function clearViewCache(prefix) {
  try {
    for (let i = sessionStorage.length - 1; i >= 0; i -= 1) {
      const key = sessionStorage.key(i);
      if (key && key.startsWith(prefix)) sessionStorage.removeItem(key);
    }
  } catch (_) {}
}

async function apiFetch(url, opts={}) {
  const { timeout = 8000, ...fetchOpts } = opts;
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeout);
  try {
    const r = await fetch(url, { ...fetchOpts, signal: controller.signal });
    const text = await r.text();
    let data = {};
    try { data = text ? JSON.parse(text) : {}; } catch (_) { data = {}; }
    if (!r.ok) throw new Error(data.detail || data.error || text || r.statusText || `HTTP ${r.status}`);
    return data;
  } catch(e) {
    if (e?.name === 'AbortError') throw new Error('request timeout');
    throw e;
  } finally {
    clearTimeout(timer);
  }
}

// ── Sidebar status ────────────────────────────────────────────────────────
function renderSidebarStatus(live, health) {
  if (live) {
    const mDot = document.getElementById('market-dot');
    const mLabel = document.getElementById('market-label');
    const open = !!live.market_tradeable;
    const label = live.market_session || 'closed';
    mDot.className = 'dot ' + (open ? 'green pulse' : 'grey');
    mLabel.textContent = open ? 'Market open' : ('Market ' + label);
  }
  if (health) {
    const lDot = document.getElementById('llm-dot');
    const lLabel = document.getElementById('llm-label');
    const llmOk = health.llm_configured;
    lDot.className = 'dot ' + (llmOk ? 'green' : 'warn');
    lLabel.textContent = llmOk ? 'LLM connected' : 'LLM not configured';
  }
}

async function updateSidebarStatus() {
  const cacheKey = 'ui:sidebar_status:v1';
  const cached = readViewCache(cacheKey, 10 * 60 * 1000);
  if (cached) renderSidebarStatus(cached.live, cached.health);
  try {
    const [liveResult, healthResult] = await Promise.allSettled([
      apiFetch('/api/live/status'),
      apiFetch('/api/health'),
    ]);
    const live = liveResult.status === 'fulfilled' ? liveResult.value : cached?.live;
    const health = healthResult.status === 'fulfilled' ? healthResult.value : cached?.health;
    renderSidebarStatus(live, health);
    if (live || health) writeViewCache(cacheKey, { live, health });
  } catch (_) {}
}
updateSidebarStatus();
setInterval(updateSidebarStatus, 30000);

// ── Expand/collapse toggle ────────────────────────────────────────────────
document.addEventListener('click', e => {
  const btn = e.target.closest('[data-expand]');
  if (!btn) return;
  const target = document.getElementById(btn.dataset.expand);
  if (!target) return;
  target.classList.toggle('open');
  btn.textContent = target.classList.contains('open') ? '▲ Hide' : '▼ Show';
});
</script>
{% block scripts %}{% endblock %}
</body>
</html>
